name: 料金データの自動更新

on:
  schedule:
    # 毎週月曜 9:00 JST (= 前日日曜 0:00 UTC) に自動実行
    - cron: "0 0 * * 1"
  workflow_dispatch: {}
    # ↑ Actionsタブから「Run workflow」ボタンで手動実行もできるようにする

permissions:
  contents: write

jobs:
  update-price:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 必要なライブラリをインストール
        run: pip install requests beautifulsoup4 lxml

      - name: 公式サイトから料金を取得して price-data.json を更新
        run: python scripts/update_price.py

      - name: 変更があればコミット・push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- price-data.json; then
            echo "変更なし。コミットしません。"
          else
            git add price-data.json
            git commit -m "料金データを自動更新"
            git push
          fi
